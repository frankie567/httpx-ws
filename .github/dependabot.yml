version: 2
updates:
    - package-ecosystem: uv
      directory: "/"
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          development:
              dependency-type: development
              patterns: ["*"]
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          github-actions:
              patterns: ["*"]
